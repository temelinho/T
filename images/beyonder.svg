<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440">
  <defs>
    <linearGradient id="bgBeyonder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0f1b33" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <pattern id="dotPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="rgba(255,255,255,0.08)" />
    </pattern>
  </defs>

  <!-- Arka Plan -->
  <rect width="100%" height="100%" fill="url(#bgBeyonder)" />
  <rect width="100%" height="100%" fill="url(#dotPattern)" />

  <!-- Işık Küreleri (Glow) -->
  <circle cx="560" cy="120" r="170" fill="#38bdf8" opacity="0.12" filter="blur(50px)" />
  <circle cx="150" cy="350" r="150" fill="#818cf8" opacity="0.1" filter="blur(45px)" />

  <!-- Header / Menü -->
  <g transform="translate(40, 35)">
    <!-- Logo -->
    <rect x="0" y="4" width="24" height="24" rx="6" fill="url(#neonBlue)" />
    <polygon points="12,7 19,16 5,16" fill="#ffffff" />
    <text x="34" y="22" font-family="'Inter', sans-serif" font-size="18" font-weight="900" fill="#ffffff" letter-spacing="2.5">BEYONDER</text>
    <text x="160" y="22" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1">STUDIO</text>

    <!-- Menü linkleri -->
    <text x="370" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.7)">Vitrin</text>
    <text x="435" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.7)">Çözümler</text>
    <text x="515" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.7)">Laboratuvar</text>
  </g>

  <!-- Sol Hero İçerik -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="165" height="24" rx="12" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" />
    <text x="12" y="16" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="0.5">DİJİTAL VİTRİN PLATFORMU</text>

    <text x="0" y="62" font-family="'Inter', sans-serif" font-size="33" font-weight="900" fill="#ffffff" letter-spacing="-0.8">
      Sıra Dışı Deneyimler,
    </text>
    <text x="0" y="100" font-family="'Inter', sans-serif" font-size="33" font-weight="900" fill="url(#neonPurple)" letter-spacing="-0.8">
      Yeni Nesil Tasarım.
    </text>

    <text x="0" y="132" font-family="'Inter', sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">
      Kendi ajans ve ürün portföyümüzü sergilediğimiz; 3D etkileşimli,
    </text>
    <text x="0" y="150" font-family="'Inter', sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">
      yüksek performanslı ve ultra modern vitrin web platformu.
    </text>

    <!-- Butonlar -->
    <rect x="0" y="174" width="130" height="36" rx="8" fill="url(#neonBlue)" />
    <text x="22" y="196" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Projeleri İncele</text>
  </g>

  <!-- Sağ Taraf: Fütüristik Vitrin Kartları & 3D Grafikler -->
  <g transform="translate(415, 95)">
    <!-- Büyük Kart -->
    <rect x="0" y="0" width="245" height="155" rx="14" fill="#13233f" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5" />
    <rect x="10" y="10" width="225" height="95" rx="8" fill="#0d182b" />
    
    <!-- 3D İllüstrasyon Çizgileri -->
    <polygon points="122,25 170,48 170,90 122,100 75,90 75,48" fill="none" stroke="url(#neonBlue)" stroke-width="2" />
    <line x1="122" y1="25" x2="122" y2="100" stroke="url(#neonPurple)" stroke-width="1.5" />
    <line x1="122" y1="62" x2="170" y2="48" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    <line x1="122" y1="62" x2="75" y2="48" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    
    <text x="14" y="132" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Interactive 3D Experience</text>

    <!-- İkinci Kart Mockup -->
    <rect x="35" y="170" width="210" height="130" rx="12" fill="#151e36" stroke="rgba(255,255,255,0.15)" />
    <rect x="43" y="178" width="194" height="80" rx="8" fill="#0b1222" />
    <text x="52" y="280" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Ultra Performance Showcase</text>
  </g>
</svg>
